name: my_ide
description: "本地优先的 Flutter 桌面 AI IDE：多供应商 Agent、审批沙箱、版本快照与远程控制。"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  file_selector: ^1.0.3
  flutter_svg: ^2.2.0
  path: ^1.9.1
  re_highlight: ^0.0.3
  re_editor: ^0.10.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  yaml: ^3.1.3
  meta: ^1.16.0
  desktop_drop: ^0.5.0
  # 使用本地 fork：上游 Windows 插件有未使用变量 headerSize，/WX 下会 C4189→C2220。
  clipboard:
    path: packages/clipboard
  flutter_markdown: ^0.7.7+1
  cryptography: ^2.9.0
  # 手机端远控：远程地址二维码渲染（纯 Dart 绘制，无平台依赖）。
  qr_flutter: ^4.1.0
  # MCP：自研轻量客户端（stdio / Streamable HTTP），不强制依赖第三方 SDK。

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# 本地 fork：file_selector_macos 上游在 legacy 分支使用 macOS 12 弃用的
# panel.allowedFileTypes 产生编译警告；宿主部署目标 12.0，fork 提到 11.0
# 并移除 legacy 分支（与 clipboard 本地 fork 同理）。
dependency_overrides:
  file_selector_macos:
    path: packages/file_selector_macos

flutter:

  uses-material-design: true

  assets:
    # 手机端远控（B8）：PWA 单页 + manifest；MobileBridge 静态托管
    # （assets/mobile/index.html，自包含无第三方 CDN 依赖）。
    - assets/mobile/

