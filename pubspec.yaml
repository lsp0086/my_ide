name: my_ide
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  file_selector: ^1.0.3
  flutter_svg: ^2.2.0
  path: ^1.9.1
  re_highlight: ^0.0.3
  re_editor: ^0.10.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  desktop_drop: ^0.5.0
  # 使用本地 fork：上游 Windows 插件有未使用变量 headerSize，/WX 下会 C4189→C2220。
  clipboard:
    path: packages/clipboard
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

