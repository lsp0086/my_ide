name: Release Desktop

# 公开仓库使用 GitHub 托管 runner（windows/macos/ubuntu）免费。
# 用法：
# 1. 仓库设为 Public
# 2. Actions 页手动 Run workflow
# 或推送 tag：git tag v1.0.0 && git push origin v1.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter config & deps
        shell: bash
        run: |
          flutter config --enable-windows-desktop --enable-linux-desktop --enable-macos-desktop
          flutter --version
          # 清掉可能残留的错误 pub.dev token，避免 authorization failed
          dart pub token remove https://pub.dev 2>/dev/null || true
          dart pub token remove https://pub.dartlang.org 2>/dev/null || true
          if ! flutter pub get; then
            echo "pub.dev 拉取失败，改用国内镜像重试..."
            export PUB_HOSTED_URL=https://pub.flutter-io.cn
            export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
            flutter pub get
          fi

      - name: Build Windows
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # 先生成 ephemeral/.plugin_symlinks，再改 MSVC 实际编译的那份文件。
          # 只改 pub-cache 不够：Windows 上 symlink/junction 目标可能不一致。
          flutter build windows --config-only --release

          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          from urllib.request import url2pathname

          def resolve_package_root(name):
              cfg = json.loads(Path('.dart_tool/package_config.json').read_text(encoding='utf-8'))
              for pkg in cfg['packages']:
                  if pkg['name'] != name:
                      continue
                  uri = pkg['rootUri']
                  if uri.startswith('file:'):
                      parsed = urlparse(uri)
                      root = Path(url2pathname(unquote(parsed.path)))
                      posix = root.as_posix()
                      if re.match(r'^/[A-Za-z]:/', posix):
                          root = Path(posix[1:])
                      return root.resolve()
                  return (Path('.dart_tool') / uri).resolve()
              return None

          def patch_tree(root):
              cmake = root / 'windows' / 'CMakeLists.txt'
              cpp = root / 'windows' / 'clipboard_plugin.cpp'
              if not cmake.exists() or not cpp.exists():
                  raise SystemExit('clipboard windows files missing under %s' % root)

              cmake_text = cmake.read_text(encoding='utf-8')
              cmake_new = cmake_text
              cmake_new = cmake_new.replace(
                  'target_compile_options(clipboard_plugin PRIVATE /W4 /WX /wd"4100")',
                  'target_compile_options(clipboard_plugin PRIVATE /W4 /WX- /wd"4100" /wd"4189")',
              )
              cmake_new = cmake_new.replace(
                  'target_compile_options(clipboard_plugin PRIVATE /W4 /WX /wd"4100" /wd"4189")',
                  'target_compile_options(clipboard_plugin PRIVATE /W4 /WX- /wd"4100" /wd"4189")',
              )
              if '/WX-' not in cmake_new:
                  raise SystemExit('failed to disable /WX in %s' % cmake)
              if cmake_new != cmake_text:
                  cmake.write_text(cmake_new, encoding='utf-8')

              cpp_text = cpp.read_text(encoding='utf-8')
              cpp_new, n = re.subn(
                  r'^[ \t]*DWORD headerSize = \(dibFormat == CF_DIBV5\) \? sizeof\(BITMAPV5HEADER\) : sizeof\(BITMAPINFOHEADER\);\r?\n',
                  '',
                  cpp_text,
                  count=1,
                  flags=re.M,
              )
              if n == 0 and re.search(r'DWORD\s+headerSize\s*=', cpp_text):
                  raise SystemExit('failed to remove headerSize in %s' % cpp)
              if n == 1:
                  cpp.write_text(cpp_new, encoding='utf-8')

              verify = (root / 'windows' / 'clipboard_plugin.cpp').read_text(encoding='utf-8')
              if re.search(r'DWORD\s+headerSize\s*=', verify):
                  raise SystemExit('headerSize still present after patch: %s' % cpp)
              print('patched clipboard plugin at %s' % root)

          real_pkg = resolve_package_root('clipboard')
          if real_pkg is None:
              raise SystemExit('clipboard package not found in package_config.json')

          # 先改 pub-cache，再把编译路径换成真实目录副本，避免 junction 指到未改副本。
          patch_tree(real_pkg)

          symlink_root = Path('windows/flutter/ephemeral/.plugin_symlinks/clipboard')
          if not symlink_root.exists():
              raise SystemExit('missing %s after --config-only' % symlink_root)

          tmp = Path('windows/flutter/ephemeral/.plugin_symlinks/clipboard.__patched__')
          if tmp.exists():
              shutil.rmtree(tmp)
          shutil.copytree(real_pkg, tmp)
          if symlink_root.is_symlink():
              symlink_root.unlink()
          elif symlink_root.exists():
              shutil.rmtree(symlink_root)
          tmp.rename(symlink_root)

          compile_cpp = Path('windows/flutter/ephemeral/.plugin_symlinks/clipboard/windows/clipboard_plugin.cpp')
          compile_text = compile_cpp.read_text(encoding='utf-8')
          if re.search(r'DWORD\s+headerSize\s*=', compile_text):
              raise SystemExit('compile-path still has headerSize: %s' % compile_cpp.resolve())
          print('compile-path ready: %s' % compile_cpp.resolve())
          PY

          # 同一步内立刻构建，避免 Flutter 重新生成 .plugin_symlinks 覆盖补丁。
          flutter build windows --release

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)"
          NAME="$(grep -E '^name:' pubspec.yaml | head -1 | awk '{print $2}')"
          SRC="build/windows/x64/runner/Release"
          if [[ ! -d "$SRC" ]]; then
            SRC="$(find build/windows -type d -path '*/runner/Release' | head -1)"
          fi
          mkdir -p dist
          (
            cd "$(dirname "$SRC")"
            powershell.exe -NoProfile -Command "Compress-Archive -Path '$(basename "$SRC")\\*' -DestinationPath '$GITHUB_WORKSPACE\\dist\\${NAME}-${VERSION}-windows-x64.zip' -Force"
          )
          ls -lh dist

      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Package Linux
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)"
          NAME="$(grep -E '^name:' pubspec.yaml | head -1 | awk '{print $2}')"
          SRC="build/linux/x64/release/bundle"
          if [[ ! -d "$SRC" ]]; then
            SRC="$(find build/linux -type d -path '*/release/bundle' | head -1)"
          fi
          mkdir -p dist
          (
            cd "$(dirname "$SRC")"
            zip -qry "$GITHUB_WORKSPACE/dist/${NAME}-${VERSION}-linux-x64.zip" "$(basename "$SRC")"
          )
          ls -lh dist

      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Package macOS
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)"
          NAME="$(grep -E '^name:' pubspec.yaml | head -1 | awk '{print $2}')"
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          mkdir -p dist
          (
            cd "$(dirname "$APP")"
            zip -qry "$GITHUB_WORKSPACE/dist/${NAME}-${VERSION}-macos.zip" "$(basename "$APP")"
          )
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my_ide-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
